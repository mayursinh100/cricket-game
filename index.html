<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Championship — Superstars</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a2e;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;color:#fff;}
#gameCanvas{display:block;width:100vw;height:100vh;}

/* ═══ APP CONTENT (management screens) ═══ */
#appContent{position:absolute;top:0;left:0;width:100%;height:100%;overflow-y:auto;background:linear-gradient(160deg,#0d1b2a 0%,#1b263b 50%,#0d1b2a 100%);z-index:50;}

/* Nav bar */
.nav-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(0,0,0,0.85);border-bottom:2px solid rgba(74,222,128,0.3);position:sticky;top:0;z-index:10;backdrop-filter:blur(10px);}
.nav-team{font-size:15px;font-weight:800;color:#4ade80;letter-spacing:0.5px;}
.nav-season{font-size:11px;color:#666;margin-left:8px;}
.nav-tabs{display:flex;gap:4px;}
.nav-tab{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#aaa;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;}
.nav-tab:hover{background:rgba(255,255,255,0.1);color:#fff;}
.nav-tab.active{background:rgba(74,222,128,0.2);border-color:#4ade80;color:#4ade80;}
.nav-budget{font-size:13px;font-weight:700;color:#facc15;}

/* Screen content */
.screen-content{padding:20px;max-width:1200px;margin:0 auto;}
.screen-title{font-size:22px;font-weight:800;margin-bottom:16px;color:#fff;}
.budget-display{font-size:13px;color:#facc15;margin-left:12px;}

/* Cards */
.card{background:rgba(20,25,40,0.8);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px;margin-bottom:12px;backdrop-filter:blur(5px);}
.card-label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;}
.card-big{font-size:24px;font-weight:800;}

/* Hub */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;}
.team-card{border-left:4px solid #4ade80;}
.team-name-big{font-size:20px;font-weight:800;margin-bottom:10px;}
.team-stats-row{display:flex;gap:8px;margin-bottom:8px;}
.mini-stat{text-align:center;flex:1;background:rgba(0,0,0,0.3);border-radius:8px;padding:6px;}
.mini-val{font-size:20px;font-weight:800;color:#4ade80;}
.mini-label{font-size:9px;color:#666;text-transform:uppercase;}
.team-rank{font-size:14px;color:#facc15;font-weight:700;margin-top:8px;}
.next-fixture{cursor:pointer;transition:all 0.2s;}
.next-fixture:hover{border-color:#4ade80;box-shadow:0 0 20px rgba(74,222,128,0.2);}
.fixture-vs{display:flex;align-items:center;justify-content:space-between;margin:10px 0;}
.fixture-team{font-size:16px;font-weight:700;flex:1;text-align:center;}
.fixture-vs-text{color:#4ade80;font-weight:900;font-size:14px;padding:0 8px;}
.fixture-info{font-size:12px;color:#888;text-align:center;margin-bottom:10px;}
.squad-summary{margin:8px 0;}
.squad-stat{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.03);}
.avg-rating{font-size:14px;color:#facc15;font-weight:700;margin:8px 0;}
.mini-table{margin:8px 0;}
.mini-table-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.03);}
.mini-table-row.highlight{color:#4ade80;font-weight:700;}

/* Player cards */
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.player-card{background:linear-gradient(145deg,rgba(20,25,40,0.9),rgba(15,20,35,0.95));border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;transition:transform 0.15s,border-color 0.15s;}
.player-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,0.2);}
.pc-header{padding:10px 12px;border-bottom:3px solid #4ade80;display:flex;justify-content:space-between;align-items:center;}
.pc-name{font-size:13px;font-weight:700;}
.pc-role{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;color:#fff;}
.pc-body{padding:10px 12px;display:flex;gap:10px;align-items:center;}
.pc-overall{text-align:center;flex-shrink:0;}
.pc-o-val{font-size:28px;font-weight:900;color:#4ade80;line-height:1;}
.pc-o-label{font-size:9px;color:#666;text-transform:uppercase;}
.pc-stats{flex:1;}
.pc-stat{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:3px;}
.pc-stat span:first-child{width:28px;color:#666;font-weight:600;}
.stat-bar{flex:1;height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;}
.stat-fill{height:100%;border-radius:3px;transition:width 0.3s;}
.pc-stat span:last-child{width:22px;text-align:right;font-weight:700;}
.pc-footer{padding:8px 12px;font-size:11px;color:#888;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,0.03);}
.pc-meta{font-size:11px;}
.pc-conditions{display:flex;gap:6px;}
.condition-pill{font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;background:rgba(0,0,0,0.3);}
.pc-cd{text-align:center;padding:4px;font-size:10px;color:#facc15;background:rgba(250,204,21,0.1);}
.pc-price{font-size:16px;font-weight:800;color:#facc15;}
.auction-card{border-color:rgba(250,204,21,0.2);}

/* XI grid */
.xi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.xi-card{background:rgba(20,25,40,0.6);border:1px solid rgba(74,222,128,0.15);border-radius:10px;padding:10px;text-align:center;}
.xi-num{font-size:20px;font-weight:900;color:#4ade80;opacity:0.5;}
.xi-name{font-size:13px;font-weight:700;margin-top:4px;}
.xi-role{font-size:10px;color:#888;margin-top:2px;}

/* Tactic buttons */
.tactic-buttons{display:flex;gap:8px;flex-wrap:wrap;}
.tactic-btn{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1);color:#aaa;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;}
.tactic-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff;}
.tactic-btn.active{background:rgba(74,222,128,0.15);border-color:#4ade80;color:#4ade80;}

/* Setup */
.setup-section{margin-bottom:16px;}
.setup-label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600;}
.match-setup-title{font-size:24px;font-weight:900;text-align:center;margin-bottom:4px;}
.match-setup-info{text-align:center;color:#888;font-size:13px;margin-bottom:16px;}

/* Action buttons */
.action-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#fff;padding:10px 24px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;display:inline-block;}
.action-btn:hover{background:rgba(255,255,255,0.15);}
.action-btn.green{background:rgba(74,222,128,0.15);border-color:#4ade80;color:#4ade80;}
.action-btn.green:hover{background:rgba(74,222,128,0.25);}
.action-btn.big{padding:14px 36px;font-size:16px;}
.action-btn.small{padding:6px 14px;font-size:12px;}
.action-btn.danger{background:rgba(239,68,68,0.15);border-color:#ef4444;color:#ef4444;}
.action-btn.disabled{opacity:0.4;cursor:not-allowed;}

/* Menu */
.menu-screen{text-align:center;padding:40px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
.menu-logo{font-size:16px;color:#4ade80;letter-spacing:4px;font-weight:600;}
.menu-title{font-size:56px;font-weight:900;background:linear-gradient(135deg,#4ade80,#22d3ee,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:10px 0;}
.menu-sub{font-size:14px;color:#666;margin-bottom:30px;}
.menu-buttons{display:flex;flex-direction:column;gap:12px;width:280px;}
.menu-btn{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1);color:#fff;padding:14px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.15s;}
.menu-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.3);}
.menu-btn.primary{background:rgba(74,222,128,0.15);border-color:#4ade80;color:#4ade80;}
.menu-btn.primary:hover{background:rgba(74,222,128,0.25);}
.menu-btn.danger{border-color:rgba(239,68,68,0.3);color:#ef4444;}
.menu-footer{margin-top:30px;font-size:12px;color:#444;}
.form-title{font-size:28px;font-weight:800;margin-bottom:8px;}
.form-sub{font-size:14px;color:#888;margin-bottom:20px;}
.text-input{width:100%;max-width:300px;padding:12px 16px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;font-size:16px;margin-bottom:16px;}

/* Training */
.training-info{font-size:13px;color:#888;margin-bottom:16px;padding:10px;background:rgba(0,0,0,0.2);border-radius:8px;}
.player-list{display:flex;flex-direction:column;gap:8px;}
.training-row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(20,25,40,0.6);border:1px solid rgba(255,255,255,0.05);border-radius:10px;}
.training-row.cooldown{opacity:0.5;}
.train-info{flex:1;}
.train-name{font-size:14px;font-weight:700;}
.train-stats{font-size:11px;color:#888;margin-top:2px;}
.train-actions{display:flex;gap:8px;}
.cd-badge{font-size:11px;color:#facc15;padding:4px 10px;background:rgba(250,204,21,0.1);border-radius:8px;font-weight:600;}
.train-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px;}
.train-option{background:rgba(20,25,40,0.6);border:2px solid rgba(255,255,255,0.05);border-radius:12px;padding:16px;cursor:pointer;transition:all 0.15s;}
.train-option:hover{border-color:#4ade80;background:rgba(74,222,128,0.05);}
.to-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.to-desc{font-size:12px;color:#888;margin-bottom:6px;}
.to-cost{font-size:11px;color:#facc15;}

/* Results */
.result-banner{text-align:center;font-size:48px;font-weight:900;padding:20px;border-radius:14px;margin-bottom:16px;}
.result-banner.win{background:linear-gradient(135deg,rgba(74,222,128,0.2),rgba(34,211,238,0.1));color:#4ade80;}
.result-banner.loss{background:linear-gradient(135deg,rgba(239,68,68,0.2),rgba(168,85,247,0.1));color:#ef4444;}
.result-score{text-align:center;font-size:20px;margin-bottom:16px;}
.result-motm{text-align:center;font-size:16px;color:#facc15;margin-bottom:20px;}
.scorecard{margin-bottom:20px;}
.sc-title{font-size:16px;font-weight:700;margin:12px 0 8px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.05);}
.sc-innings{margin-bottom:16px;}
.sc-innings-title{font-size:14px;font-weight:700;color:#4ade80;margin-bottom:8px;}
.sc-table{width:100%;font-size:12px;}
.sc-row{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,0.03);}
.sc-row.sc-header{font-weight:700;color:#888;text-transform:uppercase;font-size:10px;border-bottom:1px solid rgba(255,255,255,0.08);}
.sc-name{flex:2;}
.sc-row span{flex:1;text-align:center;}
.result-rewards{margin-bottom:20px;}
.reward-item{padding:8px;background:rgba(250,204,21,0.05);border-radius:8px;margin-bottom:4px;font-size:13px;}

/* League table */
.league-table{background:rgba(20,25,40,0.6);border-radius:12px;overflow:hidden;}
.lt-header{display:flex;padding:10px;font-size:11px;color:#666;text-transform:uppercase;font-weight:700;border-bottom:1px solid rgba(255,255,255,0.05);}
.lt-row{display:flex;padding:10px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.03);transition:background 0.15s;}
.lt-row:hover{background:rgba(255,255,255,0.02);}
.lt-row.highlight{background:rgba(74,222,128,0.05);}
.lt-team{flex:2;font-weight:700;}
.lt-header span,.lt-row span{flex:1;text-align:center;}
.lt-header span:first-child,.lt-row span:first-child{flex:0.5;}

/* Fixtures */
.fixtures-list{display:flex;flex-direction:column;gap:4px;}
.fixture-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(20,25,40,0.4);border-radius:8px;font-size:13px;border-left:3px solid transparent;}
.fixture-row.user{border-left-color:#4ade80;}
.fixture-row.played{opacity:0.6;}
.fx-round{font-size:11px;color:#666;width:30px;}
.fx-teams{flex:1;font-weight:600;}
.fx-result{font-size:11px;color:#888;}

/* Season end */
.season-end-banner{text-align:center;font-size:42px;font-weight:900;padding:30px;border-radius:14px;margin-bottom:16px;background:linear-gradient(135deg,rgba(250,204,21,0.15),rgba(74,222,128,0.1));color:#facc15;}
.season-rank{text-align:center;font-size:20px;margin-bottom:20px;}
.season-rewards{margin-bottom:20px;}

/* ═══ TV BROADCAST HUD ═══ */
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:40;font-family:'Segoe UI',Arial,sans-serif;}
#topBar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 16px;}
#teamInfo{display:flex;gap:12px;}
.t-name{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;padding:6px 14px;border-radius:8px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);}
.t-bat{border-left:3px solid #4ade80;}
.t-bowl{border-left:3px solid #facc15;}
.t-flag{font-size:16px;}
#scoreBox{background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);padding:8px 20px;border-radius:10px;text-align:center;border:1px solid rgba(255,255,255,0.1);}
#mainScore{font-size:36px;font-weight:900;color:#fff;line-height:1;}
#subScore{font-size:11px;color:#888;margin-top:2px;}
#statsRow{display:flex;gap:8px;}
.stat-box{background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);padding:6px 12px;border-radius:8px;text-align:center;border:1px solid rgba(255,255,255,0.08);}
.stat-label{font-size:9px;color:#666;text-transform:uppercase;letter-spacing:1px;}
.stat-val{font-size:16px;font-weight:800;color:#4ade80;}
#overWidget{position:absolute;top:90px;right:16px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);}
#overTitle{font-size:9px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
#overBalls{display:flex;gap:4px;}
.over-ball{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:rgba(255,255,255,0.1);color:#aaa;}
.over-ball.run{background:rgba(74,222,128,0.2);color:#4ade80;}
.over-ball.four{background:rgba(34,211,238,0.25);color:#22d3ee;}
.over-ball.six{background:rgba(250,204,21,0.25);color:#facc15;}
.over-ball.wicket{background:rgba(239,68,68,0.25);color:#ef4444;}
.over-ball.dot{background:rgba(255,255,255,0.05);color:#555;}
#eventText{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);font-size:58px;font-weight:900;text-shadow:0 4px 20px rgba(0,0,0,0.8);opacity:0;pointer-events:none;text-align:center;}
#commentary{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);font-size:15px;color:#fff;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);padding:8px 20px;border-radius:8px;opacity:0;transition:opacity 0.3s;text-align:center;max-width:600px;}
#matchControls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;}
#matchControls .action-btn{background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);}
#inningsBanner{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);}
#inningsBanner.show{display:flex;}
#bannerTitle{font-size:42px;font-weight:900;color:#4ade80;margin-bottom:8px;}
#bannerSub{font-size:18px;color:#aaa;}

/* Responsive */
@media(max-width:768px){
  .screen-content{padding:12px;}
  .nav-tab{padding:6px 10px;font-size:11px;}
  .nav-team{font-size:12px;}
  .player-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
  #mainScore{font-size:28px;}
  .menu-title{font-size:36px;}
}

</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="appContent"></div>
<div id="hud"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/persist.js"></script>
<script src="js/match.js"></script>
<script src="js/ui.js"></script>
<script src="js/matchui.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
//  3D SCENE — EA Sports Cricket 07 style broadcast presentation
// ═══════════════════════════════════════════════════════════════

var scene, camera, renderer, clock;
var ballMesh, batsmanGrp, bowlerGrp;
var ballPos, ballVel;
var ballMoving = false, ballPhase = 'idle';
var ballBounced = false;
// Broadcast camera: behind bowler, looking at batsman
var camAngle = Math.PI, camDist = 18, camH = 8;
var camTargetX = 0, camTargetY = 1.5, camTargetZ = 8;
var isDragging = false, lastMX = 0, lastMY = 0;
var animFrame = 0;
var bowlerRunT = 0, bowlerRunning = false;
var batSwingT = -1;
var particles = [];
var stumpGroupBat, stumpGroupBowl;
var trailMeshes = [];
var crowdMeshes = [];

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x4a90d9);
  scene.fog = new THREE.Fog(0x8ec5e8, 150, 300);

  clock = new THREE.Clock();

  renderer = new THREE.WebGLRenderer({canvas:document.getElementById('gameCanvas'),antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.1, 500);

  ballPos = new THREE.Vector3(0, 0.5, -9);
  ballVel = new THREE.Vector3(0, 0, 0);

  buildScene();
  buildLights();
  setupCameraControls();
  window.addEventListener('resize', onResize);
  animate();
}

function buildScene() {
  buildSky(); buildGround(); buildPitch(); buildBoundary();
  buildStadium(); buildFloodlights(); buildBall(); buildPlayers(); buildFielders();
}

function buildSky() {
  var skyGeo = new THREE.SphereGeometry(220, 32, 16);
  var skyMat = new THREE.ShaderMaterial({
    uniforms:{topColor:{value:new THREE.Color(0x2a6cd4)},bottomColor:{value:new THREE.Color(0xb0d8f0)}},
    vertexShader:'varying vec3 vWorldPosition;void main(){vWorldPosition=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform vec3 topColor;uniform vec3 bottomColor;varying vec3 vWorldPosition;void main(){float h=normalize(vWorldPosition).y;gl_FragColor=vec4(mix(bottomColor,topColor,max(h,0.0)),1.0);}',
    side:THREE.BackSide
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
  // Clouds
  var cloudGeo = new THREE.BufferGeometry();
  var cloudVerts = [];
  for(var i=0;i<2000;i++){var theta=Math.random()*Math.PI*2;var phi=Math.acos(Math.random()*0.5+0.4);var r=190;cloudVerts.push(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));}
  cloudGeo.setAttribute('position', new THREE.Float32BufferAttribute(cloudVerts,3));
  scene.add(new THREE.Points(cloudGeo, new THREE.PointsMaterial({color:0xffffff,size:1.2,sizeAttenuation:true,transparent:true,opacity:0.6})));
}

function buildGround() {
  var outfield = new THREE.Mesh(new THREE.CircleGeometry(85, 80), new THREE.MeshLambertMaterial({color:0x2d8c2d}));
  outfield.rotation.x = -Math.PI/2; outfield.receiveShadow = true; scene.add(outfield);
  for(var i=0;i<20;i++){
    var stripe = new THREE.Mesh(new THREE.PlaneGeometry(8.5,170), new THREE.MeshLambertMaterial({color:i%2===0?0x3a9a3a:0x2d8c2d,transparent:true,opacity:0.5}));
    stripe.rotation.x = -Math.PI/2; stripe.position.set(-72+i*8,0.01,0); stripe.receiveShadow = true; scene.add(stripe);
  }
  // 30-yard inner circle
  addCircle(30,0x88cc88,0.02);
  // Boundary line
  addCircle(68,0xffffff,0.03);
  // Deep field texture dots
  for(var d=0;d<200;d++){var da=Math.random()*Math.PI*2;var dr=35+Math.random()*30;var dot=new THREE.Mesh(new THREE.CircleGeometry(0.3,6),new THREE.MeshLambertMaterial({color:0x2a7a2a}));dot.rotation.x=-Math.PI/2;dot.position.set(Math.cos(da)*dr,0.015,Math.sin(da)*dr);scene.add(dot);}
}

function addCircle(r,color,y){var pts=[];var segs=80;for(var i=0;i<=segs;i++){var a=(i/segs)*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*r,y||0,Math.sin(a)*r));}var geo=new THREE.BufferGeometry().setFromPoints(pts);scene.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:color})));}

function buildPitch() {
  var pitch = new THREE.Mesh(new THREE.BoxGeometry(3.05,0.022,20.12), new THREE.MeshLambertMaterial({color:0xd4b87a}));

function buildBoundary() {

  var curve=new THREE.CatmullRomCurve3(pts,true);scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,160,0.15,6,true),new THREE.MeshPhongMaterial({color:0xf0f0f0,shininess:20})));

  var boardColors=[0xcc2200,0x0055cc,0x007700,0xcc7700,0x550088,0x0088cc,0xcc1177,0x222222];

function buildStadium() {
  var tierColors=[0x3a3a4a,0x323242,0x2a2a3a];
  for(var tier=0;tier<3;tier++){
    var innerR=76+tier*18,outerR=innerR+16,h=8+tier*6,baseY=tier*7;
    var shape=new THREE.Shape();shape.absarc(0,0,outerR,0,Math.PI*2,false);
    var hole=new THREE.Path();hole.absarc(0,0,innerR,0,Math.PI*2,true);shape.holes.push(hole);
    var stand=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:h,bevelEnabled:false}),new THREE.MeshPhongMaterial({color:tierColors[tier],shininess:10}));
    stand.rotation.x=-Math.PI/2;stand.position.y=baseY;stand.receiveShadow=true;scene.add(stand);
    // Seats with crowd
    var seatColors=[0x1144cc,0xcc1111,0x11aa11,0xccaa11,0x9933cc,0x0099aa];
    var numSectors=16;
    for(var sec=0;sec<numSectors;sec++){
      var secAng=(sec/numSectors)*Math.PI*2,nextAng=((sec+1)/numSectors)*Math.PI*2;var rows=3+tier;
      for(var row=0;row<rows;row++){
        var rowR=innerR+2+(row/rows)*(outerR-innerR-4);var cols=Math.floor(rowR*0.12);
        for(var col=0;col<cols;col++){
          var colAng=secAng+(col/cols)*(nextAng-secAng);var sx=Math.cos(colAng)*rowR;var sz=Math.sin(colAng)*rowR;
          var seat=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.4,0.5),new THREE.MeshPhongMaterial({color:seatColors[sec%6],shininess:5}));
          seat.position.set(sx,baseY+row*1.3+0.5,sz);scene.add(seat);
          // Crowd figures
          if(Math.random()>0.12){
            var shirtCol=[0xff5500,0x0066ff,0xffcc00,0xff2222,0x22ff22,0xff69b4,0xffffff,0x9b59b6][Math.floor(Math.random()*8)];
            var body=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.1,0.35,6),new THREE.MeshLambertMaterial({color:shirtCol}));
            body.position.set(sx,baseY+row*1.3+0.9,sz);scene.add(body);crowdMeshes.push(body);
            var head=new THREE.Mesh(new THREE.SphereGeometry(0.13,6,5),new THREE.MeshLambertMaterial({color:0xc8a080}));
            head.position.set(sx,baseY+row*1.3+1.15,sz);scene.add(head);crowdMeshes.push(head);
          }
        }
      }
    }
  }
  // Roof sections
  for(var i=0;i<12;i++){var a=(i/12)*Math.PI*2;var roof=new THREE.Mesh(new THREE.BoxGeometry(24,0.8,16),new THREE.MeshPhongMaterial({color:0x1a1a2a,shininess:20}));roof.position.set(Math.cos(a)*88,24,Math.sin(a)*88);roof.rotation.y=-a;scene.add(roof);}
  // Big screen
  var sb=new THREE.Mesh(new THREE.BoxGeometry(22,12,1.5),new THREE.MeshPhongMaterial({color:0x0a0a1a,shininess:50,specular:0x444466}));sb.position.set(0,18,94);scene.add(sb);
  var sbScreen=new THREE.Mesh(new THREE.PlaneGeometry(18,8),new THREE.MeshBasicMaterial({color:0x001122}));sbScreen.position.set(0,18,94.8);scene.add(sbScreen);
  // Pavilion buildings
  for(var i=0;i<4;i++){var pav=new THREE.Mesh(new THREE.BoxGeometry(14,6,4),new THREE.MeshPhongMaterial({color:0x2a2a3a,shininess:10}));pav.position.set(Math.cos(i*Math.PI/2)*80,3,Math.sin(i*Math.PI/2)*80);pav.rotation.y=i*Math.PI/2;scene.add(pav);}
}

function buildFloodlights() {

    var poleMat=new THREE.MeshPhongMaterial({color:0x999999,shininess:30});

function buildPlayers() {

function buildCricketer(shirtCol,pantsCol,skinCol,isBat) {
  var g=new THREE.Group();
  var shirt=new THREE.MeshPhongMaterial({color:shirtCol,shininess:30,specular:0x333333});var pants=new THREE.MeshPhongMaterial({color:pantsCol,shininess:20,specular:0x222222});var skin=new THREE.MeshPhongMaterial({color:skinCol,shininess:15,specular:0x111111});
  var boots=new THREE.MeshPhongMaterial({color:0x222222,shininess:40});var white=new THREE.MeshPhongMaterial({color:0xffffff,shininess:30});var helmCol=new THREE.MeshPhongMaterial({color:shirtCol,shininess:60,specular:0x666666});var darkBlue=new THREE.MeshPhongMaterial({color:0x0a1a3a,shininess:40});
  // Boots
  [-0.12,0.12].forEach(function(x){var boot=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.1,0.28),boots);boot.position.set(x,-0.09,0.04);g.add(boot);});
  // Legs with pads
  [-0.11,0.11].forEach(function(x){var leg=new THREE.Mesh(new THREE.CylinderGeometry(0.068,0.06,0.52,10),pants);leg.position.set(x,0.17,0);g.add(leg);var pad=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.44,0.11),white);pad.position.set(x,0.19,0.1);g.add(pad);});
  // Hips
  var hips=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.18,0.38,10),pants);hips.position.y=0.47;g.add(hips);
  // Torso with chest detail
  var torso=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.19,0.56,10),shirt);torso.position.y=0.84;g.add(torso);
  // Arms
  var armMat=shirt;
  [-0.26,0.26].forEach(function(x){var upperArm=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.05,0.3,8),armMat);upperArm.position.set(x,0.95,0);g.add(upperArm);var forearm=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.045,0.28,8),skin);forearm.position.set(x,0.7,0);g.add(forearm);var hand=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,6),skin);hand.position.set(x,0.55,0.02);g.add(hand);});
  // Neck
  var neck=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.08,8),skin);neck.position.y=1.2;g.add(neck);
  // Head
  var head=new THREE.Mesh(new THREE.SphereGeometry(0.155,16,14),skin);head.position.y=1.34;head.scale.set(1,1.08,1);g.add(head);
  // Helmet
  var helmet=new THREE.Mesh(new THREE.SphereGeometry(0.175,16,10,0,Math.PI*2,0,Math.PI*0.6),helmCol);helmet.position.y=1.38;g.add(helmet);
  // Helmet grill
  for(var gi=0;gi<5;gi++){var grillY=1.28-gi*0.02;var grill=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.008,0.008),darkBlue);grill.position.set(0,grillY,0.15);g.add(grill);}
  // Bat
  if(isBat){
    var batGrp=new THREE.Group();batGrp.name='bat';
    var handle=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.3,8),new THREE.MeshPhongMaterial({color:0x222222,shininess:20}));handle.position.y=0.15;batGrp.add(handle);
    var blade=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.52,0.03),new THREE.MeshPhongMaterial({color:0xd4a030,shininess:50,specular:0x886622}));blade.position.y=-0.12;batGrp.add(blade);
    batGrp.position.set(0.32,0.78,0.1);batGrp.rotation.z=-0.2;g.add(batGrp);
  }
  return g;
}

function buildFielders() {
  var positions=[[22,0,-20],[-22,0,-20],[0,0,-34],[18,0,4],[-18,0,4],[38,0,2],[-38,0,2],[15,0,34],[-15,0,34],[2,0,48]];
  positions.forEach(function(p){
    var f=buildCricketer(0x8b1a1a,0xfff0e0,0xe8c8a0,false);f.position.set(p[0],0,p[2]);f.rotation.y=Math.atan2(-p[0],-p[2]);scene.add(f);
  });
  var wk=buildCricketer(0x8b1a1a,0xfff0e0,0xe8c8a0,false);wk.position.set(0,0,12.5);wk.rotation.y=Math.PI;scene.add(wk);
  // Two umpires
  var ump1=buildCricketer(0x111111,0x222222,0xd0a070,false);ump1.position.set(0,0,11);ump1.scale.set(0.9,0.9,0.9);scene.add(ump1);
  var ump2=buildCricketer(0x111111,0x222222,0xd0a070,false);ump2.position.set(-2,0,-4);ump2.scale.set(0.9,0.9,0.9);scene.add(ump2);
}

function setupCameraControls() {
  var c=document.getElementById('gameCanvas');
  c.addEventListener('mousedown',function(e){if(e.button===0){isDragging=true;lastMX=e.clientX;lastMY=e.clientY;}});
  window.addEventListener('mouseup',function(){isDragging=false;});
  window.addEventListener('mousemove',function(e){if(!isDragging)return;camAngle+=(e.clientX-lastMX)*0.01;camH=Math.max(4,Math.min(28,camH-(e.clientY-lastMY)*0.06));lastMX=e.clientX;lastMY=e.clientY;});
  c.addEventListener('wheel',function(e){camDist=Math.max(8,Math.min(50,camDist+e.deltaY*0.04));});
}

// --- Event/commentary helpers (used by MatchUI) ---
function showEvent(html,color){var el=document.getElementById('eventText');if(!el)return;el.innerHTML=html;el.style.color=color;el.style.opacity='1';el.style.fontSize='58px';el.style.transition='none';setTimeout(function(){el.style.transition='all 0.8s';el.style.opacity='0';el.style.fontSize='70px';},50);setTimeout(function(){el.style.fontSize='0px';el.style.transition='none';},900);}
function showCommentary(text){var el=document.getElementById('commentary');if(!el)return;el.textContent=text;el.style.opacity='1';setTimeout(function(){el.style.opacity='0';},3000);}
function spawnParticles(pos,color,count){
  for(var i=0;i<count;i++){
    var p=new THREE.Mesh(new THREE.SphereGeometry(0.08,4,4),new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:1}));
    p.position.copy(pos);scene.add(p);
    particles.push({mesh:p,vel:new THREE.Vector3((Math.random()-.5)*.45,Math.random()*.55+.1,(Math.random()-.5)*.45),life:1.0});
  }
}

// --- Animation loop ---
function animate() {
  requestAnimationFrame(animate);
  var dt=clock.getDelta();animFrame++;
  // Broadcast camera: positioned behind bowler looking at batsman
  camera.position.set(Math.sin(camAngle)*camDist,camH,Math.cos(camAngle)*camDist+camTargetZ);
  camera.lookAt(camTargetX,camTargetY,camTargetZ);

  if(ballPos&&ballVel){
    if(ballMoving&&ballPhase==='bowling'){
      ballPos.add(ballVel);ballVel.y-=0.014;ballVel.x+=(Math.random()-.5)*0.0018;
      if(ballPos.y<=0.038&&!ballBounced){ballBounced=true;ballPos.y=0.038;ballVel.y=Math.abs(ballVel.y)*0.55;if(ballVel.y<0.02)ballVel.y=0.02;ballVel.z*=0.95;ballVel.x+=(Math.random()-.5)*0.04;}
      if(ballPos.y<=0.038&&ballBounced){ballPos.y=0.038;ballVel.y*=0.4;ballVel.z*=0.96;}
      ballMesh.rotation.x+=0.38;ballMesh.rotation.z+=0.14;ballMesh.position.copy(ballPos);
      for(var t=trailMeshes.length-1;t>0;t--){trailMeshes[t].position.copy(trailMeshes[t-1].position);trailMeshes[t].material.opacity=0.08*(1-t/trailMeshes.length);}
      trailMeshes[0].position.copy(ballPos);
      if(ballPos.z>11.5&&ballPhase==='bowling'){ballPhase='idle';ballMoving=false;}
    }
    if(ballMoving&&ballPhase==='shot'){
      ballPos.add(ballVel);ballVel.y-=0.022;ballVel.multiplyScalar(0.988);
      if(ballPos.y<0.038){ballPos.y=0.038;ballVel.y*=-0.25;ballVel.multiplyScalar(0.8);}
      ballMesh.position.copy(ballPos);ballMesh.rotation.x+=0.55;
    }
  }
  if(bowlerRunning&&bowlerGrp){bowlerRunT+=dt*5;bowlerGrp.position.z=-9.5+Math.min(bowlerRunT*0.85,2.2);if(bowlerRunT>2.5){bowlerRunning=false;bowlerGrp.position.z=-9.5;}}
  if(batSwingT>=0&&batsmanGrp){batSwingT+=dt*6;var bat=batsmanGrp.getObjectByName('bat');if(bat){bat.rotation.x=Math.sin(batSwingT)*1.6;if(batSwingT>Math.PI){batSwingT=-1;bat.rotation.x=0;}}}
  if(batsmanGrp&&(ballPhase==='idle'||ballPhase==='bowling')){batsmanGrp.position.y=Math.sin(animFrame*0.04)*0.01;}
  // Crowd subtle movement
  if(animFrame%60===0){crowdMeshes.forEach(function(m){if(Math.random()>0.7){m.position.y+=0.05;setTimeout(function(){m.position.y-=0.05;},200);}});}
  particles=particles.filter(function(p){p.life-=dt*1.6;p.vel.y-=0.013;p.mesh.position.add(p.vel);p.mesh.material.opacity=Math.max(0,p.life);if(p.life<=0){scene.remove(p.mesh);return false;}return true;});
  renderer.render(scene,camera);
}

function onResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);}

// ═══ APP STARTUP ═══
function startApp() {
  Game.init();
  if (Save.exists()) {
    Save.load();
  }
  // Show UI FIRST so the page is never blank, even if 3D fails
  UI.show(Game.state.screen || 'menu');
  // Start 3D scene — wrapped in try-catch so WebGL errors don't break the app
  try {
    init();
  } catch(e) {
    console.warn('3D scene failed to init:', e.message);
  }
}

startApp();
